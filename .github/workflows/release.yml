name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release version to (re)publish to the Homebrew tap (e.g. v0.1.1). Skips build; reuses assets already attached to that GitHub Release.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: endara-relay
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary: endara-relay
          # rustup-init shim on macos-latest is cleared explicitly by the 'Clear rustup-init shim (macOS)' step below, so macos-latest is safe again.
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: endara-relay
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: endara-relay.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Pin third-party actions on the signing/release path to immutable
      # commit SHAs (CI-003 in the consolidated security audit). The build job
      # imports an Apple signing keychain and produces notarized artifacts;
      # any compromise of a moving tag (e.g. `@stable`, `@v2`) on a third-party
      # action would let the attacker exfiltrate the signing identity or swap
      # the artifact before notarization.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      # macos-latest (and sometimes pinned macOS images) ship a rustup-init
      # shim at /usr/local/bin/cargo that wins on PATH over the
      # dtolnay-installed ~/.cargo/bin/cargo. The shim rejects 'cargo build'
      # with "error: unexpected argument 'build' found" and burned
      # v0.1.6-rc.6 (run 25864172650). Remove the shims so the toolchain
      # cargo wins.
      - name: Clear rustup-init shim (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo rm -f /usr/local/bin/cargo /usr/local/bin/rustc /usr/local/bin/rustup
          which cargo
          cargo --version
      - uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: build-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
      - name: Import Apple certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 12)
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
      - name: Codesign binary
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --options runtime --sign "$APPLE_SIGNING_IDENTITY" "target/${{ matrix.target }}/release/${{ matrix.binary }}"
      - name: Rename binary
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          dst="endara-relay-${{ matrix.target }}"
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            dst="${dst}.exe"
          fi
          cp "$src" "$dst"
      - name: Notarize binary
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dst="endara-relay-${{ matrix.target }}"
          zip "${dst}.zip" "$dst"
          xcrun notarytool submit "${dst}.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
      - name: Create tar.gz archive for Homebrew
        if: matrix.target != 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="endara-relay-v${version}-${{ matrix.target }}.tar.gz"
          staging="$(mktemp -d)"
          cp "endara-relay-${{ matrix.target }}" "${staging}/endara-relay"
          tar -C "${staging}" -czf "${archive}" endara-relay
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: endara-relay-${{ matrix.target }}
          path: |
            endara-relay-${{ matrix.target }}*
            endara-relay-v*-${{ matrix.target }}.tar.gz

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create Release
        # Pinned to the v2.6.2 commit SHA (CI-003). The release job is the
        # one that actually publishes notarized artifacts to consumers.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') }}
          files: artifacts/*

  update-homebrew-tap:
    needs: release
    # Only run on stable tag pushes (skip -rc.* prereleases) or manual workflow_dispatch.
    if: |
      always() &&
      (
        (github.event_name == 'push' && needs.release.result == 'success' && !contains(github.ref_name, '-rc.')) ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    # CI-013 hardening: narrow GITHUB_TOKEN to read-only for this job so a
    # successful injection (e.g. CI-002 or a compromised third-party action)
    # cannot use the workflow-default `contents: write` to push tampered
    # commits back to this repo. Writes to the consumer-facing
    # `endara-ai/homebrew-tap` are gated separately on `HOMEBREW_TAP_TOKEN`,
    # which is only ever attached to the dedicated `Checkout homebrew-tap`
    # step below — no other step in this job references it.
    permissions:
      contents: read
    steps:
      - name: Resolve version
        id: version
        # Defense in depth (CI-002): every value that originates from
        # attacker-influenceable context (`inputs.version`, `github.ref_name`,
        # `github.event_name`) is exported into the shell via `env:` and read
        # as a quoted variable, never interpolated directly into the script
        # body where a value such as `v$(curl evil)` would execute.
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="${INPUT_VERSION}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ -z "$tag" ]]; then
            echo "Could not resolve a version/tag." >&2
            exit 1
          fi
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Download tar.gz archives from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p archives
          for target in aarch64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            asset="endara-relay-v${VERSION}-${target}.tar.gz"
            echo "Downloading ${asset} from release ${TAG}..."
            gh release download "${TAG}" \
              --repo "${{ github.repository }}" \
              --pattern "${asset}" \
              --dir archives
          done
      - name: Compute SHA256 sums
        id: sha
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          compute() {
            local file="$1"
            if [[ ! -s "$file" ]]; then
              echo "Asset $file is missing or empty; refusing to publish a tap commit." >&2
              exit 1
            fi
            local sum
            sum=$(shasum -a 256 "$file" | awk '{print $1}')
            # Sanity-check the digest before it is interpolated into the cask.
            # A non-hex value here would mean either the upstream tool
            # changed format or someone managed to substitute a script-like
            # string into the workflow context.
            if [[ ! "$sum" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Computed SHA-256 for $file is not 64-char hex: '$sum'" >&2
              exit 1
            fi
            printf '%s' "$sum"
          }
          sha_arm64_darwin=$(compute "archives/endara-relay-v${VERSION}-aarch64-apple-darwin.tar.gz")
          sha_arm64_linux=$(compute "archives/endara-relay-v${VERSION}-aarch64-unknown-linux-gnu.tar.gz")
          sha_x64_linux=$(compute "archives/endara-relay-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz")
          {
            echo "arm64_darwin=${sha_arm64_darwin}"
            echo "arm64_linux=${sha_arm64_linux}"
            echo "x64_linux=${sha_x64_linux}"
          } >> "$GITHUB_OUTPUT"
      - name: Checkout endara-relay (for update-formula.py)
        uses: actions/checkout@v4
        with:
          path: relay
          # CI-013: don't let actions/checkout persist GITHUB_TOKEN as a git
          # credential here. The next step performs a *separate* checkout with
          # `HOMEBREW_TAP_TOKEN` and inherits any persisted credentials in the
          # global git config; keeping per-step token scoping keeps the tap
          # PAT isolated to the homebrew-tap working tree only.
          persist-credentials: false
      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: endara-ai/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update formula
        # Move every steps.*.outputs.* value into env (CI-002). The version
        # output transitively comes from `inputs.version` / `github.ref_name`,
        # which a tag-pusher or workflow-dispatch caller controls; the SHA
        # outputs are computed from local files and are inert hex, but are
        # exported uniformly for consistency.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA_ARM64_DARWIN: ${{ steps.sha.outputs.arm64_darwin }}
          SHA_ARM64_LINUX: ${{ steps.sha.outputs.arm64_linux }}
          SHA_X64_LINUX: ${{ steps.sha.outputs.x64_linux }}
        run: |
          mkdir -p homebrew-tap/Formula
          python3 relay/scripts/update-formula.py \
            --version "$VERSION" \
            --sha256-arm64-darwin "$SHA_ARM64_DARWIN" \
            --sha256-arm64-linux "$SHA_ARM64_LINUX" \
            --sha256-x64-linux "$SHA_X64_LINUX" \
            --formula-path homebrew-tap/Formula/endara-relay.rb
      - name: Commit and push to homebrew-tap
        working-directory: homebrew-tap
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "endara-bot"
          git config user.email "endara-bot@users.noreply.github.com"
          git add Formula/endara-relay.rb
          if git diff --cached --quiet; then
            echo "No formula changes to commit."
            exit 0
          fi
          git commit -m "chore: bump endara-relay to ${VERSION}"
          git push origin HEAD:main

