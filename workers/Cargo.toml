[package]
name = "endara-relay-worker"
version = "0.1.0"
edition = "2021"
description = "Endara Relay on Cloudflare Workers — aggregate remote MCP servers behind one edge endpoint"
license = "Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "0.9"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = { version = "0.8", default-features = false, features = ["parse"] }
toon-format = { version = "0.4", default-features = false }
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
