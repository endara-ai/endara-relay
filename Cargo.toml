[package]
name = "endara-relay"
version = "0.1.10"
edition = "2021"
description = "Local MCP tool aggregator — aggregate multiple MCP servers behind a single endpoint"
license = "Apache-2.0"
repository = "https://github.com/endara-ai/endara-relay"
keywords = ["mcp", "ai", "tools", "aggregator", "model-context-protocol"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["form", "json"] }
base64 = "0.22"
boa_engine = "0.20"
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
dirs = "6.0.0"
futures-util = "0.3.32"
getrandom = "0.2"
hostname = "0.4.2"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["http1", "http2", "server", "server-auto", "tokio"] }
jsonschema = "0.46.5"
notify = "7"
rand = "0.10.1"
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["json", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
strsim = "0.11.1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
toon-format = { version = "0.4", default-features = false }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
url = "2.5.8"
uuid = { version = "1.23.0", features = ["v4"] }

[[bin]]
name = "fixture-slow-server"
path = "tests/fixtures/slow_server.rs"

[[bin]]
name = "fixture-crash-server"
path = "tests/fixtures/crash_server.rs"

[[bin]]
name = "fixture-multi-tool-server"
path = "tests/fixtures/multi_tool_server.rs"

[[bin]]
name = "fixture-sse-server"
path = "tests/fixtures/sse_server.rs"

[[bin]]
name = "fixture-http-server"
path = "tests/fixtures/http_server.rs"

[[bin]]
name = "fixture-bad-server"
path = "tests/fixtures/bad_server.rs"

[[bin]]
name = "fixture-swap-notify-server"
path = "tests/fixtures/swap_notify_server.rs"

[dev-dependencies]
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
serde_json = "1"
serial_test = "3.5.0"
tempfile = "3.27.0"
tokio = { version = "1", features = ["test-util"] }
which = "7"
